<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Windows 개발환경 구축 치트시트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <style>
/* ---------- Tokens ---------- */
:root {
  --bg: #f6f4ef;
  --bg-elev: #fbfaf6;
  --bg-sunken: #efece4;
  --ink: #1a1916;
  --ink-2: #46443e;
  --ink-3: #7a776e;
  --ink-4: #b3afa3;
  --line: #e3dfd2;
  --line-2: #d2cdbd;
  --accent: oklch(0.55 0.08 200);
  --accent-soft: oklch(0.93 0.025 200);
  --accent-ink: oklch(0.38 0.06 200);
  --ok: oklch(0.58 0.09 150);
  --ok-soft: oklch(0.94 0.03 150);
  --warn: oklch(0.62 0.10 70);
  --warn-soft: oklch(0.95 0.04 75);
  --term-bg: #1c1b18;
  --term-bg-2: #232220;
  --term-fg: #e8e4d8;
  --term-mute: #8a8678;
  --term-prompt: oklch(0.78 0.10 200);
  --term-ok: oklch(0.78 0.13 150);
  --term-warn: oklch(0.82 0.13 75);
  --term-err: oklch(0.74 0.14 25);
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --font-sans: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
  --shadow-sm: 0 1px 0 rgba(20,18,10,0.04), 0 1px 2px rgba(20,18,10,0.04);
  --shadow-md: 0 1px 0 rgba(20,18,10,0.05), 0 4px 14px -6px rgba(20,18,10,0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.005em;
}
button { font-family: inherit; cursor: pointer; }
.app {
  min-height: 100vh;
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 32px 64px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.02em;
}
.brand-meta { display: flex; flex-direction: column; gap: 2px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.title-h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
.progress-summary { display: flex; align-items: center; gap: 16px; }
.progress-text { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.progress-text strong { color: var(--ink); font-weight: 600; }
.progress-track { width: 220px; height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 320ms cubic-bezier(.2,.7,.2,1); }
.reset-btn {
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--ink-3);
  font-size: 12px;
  border-radius: var(--r-md);
  padding: 6px 10px;
  transition: all 160ms ease;
}
.reset-btn:hover { color: var(--ink); border-color: var(--ink-4); background: var(--bg-elev); }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
.steps-panel {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 8px;
  position: sticky;
  top: 20px;
}
.steps-list { display: flex; flex-direction: column; gap: 2px; }
.step-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  width: 100%;
  transition: background 140ms ease, border-color 140ms ease;
  cursor: pointer;
}
.step-item:hover { background: var(--bg-sunken); }
.step-item.is-active { background: #fff; border-color: var(--line); box-shadow: var(--shadow-sm); }
.step-item.is-done .step-num { background: var(--accent); color: white; border-color: var(--accent); }
.step-item.is-done .step-label { color: var(--ink-3); }
.step-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line-2);
  background: var(--bg);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-2);
  flex-shrink: 0;
  transition: all 200ms ease;
}
.step-item.is-active .step-num { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.step-item.is-active.is-done .step-num { background: var(--accent); color: white; }
.step-num svg { width: 13px; height: 13px; }
.step-label { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.step-label-title { font-size: 13px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
.step-label-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); letter-spacing: 0.02em; }
.steps-divider { height: 1px; background: var(--line); margin: 6px 8px; }
.flow-link {
  display: block;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--ink-3);
  border-radius: var(--r-md);
  text-decoration: none;
  background: transparent;
  border: 1px solid transparent;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.flow-link:hover { background: var(--bg-sunken); color: var(--ink); }
.flow-link.is-active { background: #fff; border-color: var(--line); box-shadow: var(--shadow-sm); color: var(--ink); }
.flow-link-icon { display: inline-block; width: 14px; text-align: center; margin-right: 6px; color: var(--ink-4); font-family: var(--font-mono); }
.detail {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  min-height: 560px;
  display: flex;
  flex-direction: column;
}
.detail-header {
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}
.detail-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-ink); margin: 0 0 6px; }
.detail-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--ink); }
.detail-desc { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; line-height: 1.55; max-width: 56ch; }
.complete-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-family: var(--font-mono);
  background: var(--bg);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 6px 12px;
  color: var(--ink-2);
  transition: all 160ms ease;
  white-space: nowrap;
}
.complete-pill:hover { background: white; border-color: var(--ink-4); }
.complete-pill.is-done { background: var(--ok-soft); border-color: oklch(0.85 0.06 150); color: oklch(0.35 0.08 150); }
.complete-pill svg { width: 12px; height: 12px; }
.detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1; }
.instructions { padding: 22px 28px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.section-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 -4px; }
.cmd-block { display: flex; flex-direction: column; gap: 8px; }
.cmd {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 0;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--ink);
  overflow: hidden;
  transition: border-color 160ms ease;
}
.cmd:hover { border-color: var(--line-2); }
.cmd-prompt { padding: 10px 4px 10px 12px; color: var(--accent-ink); user-select: none; font-weight: 600; }
.cmd-text { padding: 10px 8px; flex: 1; white-space: pre; overflow-x: auto; scrollbar-width: thin; }
.cmd-copy {
  background: transparent;
  border: none;
  border-left: 1px solid var(--line);
  padding: 0 12px;
  height: 100%;
  align-self: stretch;
  color: var(--ink-3);
  font-size: 11px;
  font-family: var(--font-mono);
  display: flex; align-items: center; gap: 6px;
  transition: color 140ms ease, background 140ms ease;
  letter-spacing: 0.04em;
}
.cmd-copy:hover { color: var(--ink); background: var(--bg-sunken); }
.cmd-copy.is-copied { color: var(--ok); }
.cmd-copy svg { width: 12px; height: 12px; }
.note { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin: 0; }
.note code { font-family: var(--font-mono); font-size: 12px; background: var(--bg-sunken); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
.callout { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: var(--r-md); font-size: 13px; line-height: 1.5; }
.callout svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
.callout-warn { background: var(--warn-soft); border: 1px solid oklch(0.86 0.06 75); color: oklch(0.40 0.09 70); }
.callout-ok { background: var(--ok-soft); border: 1px solid oklch(0.85 0.06 150); color: oklch(0.35 0.08 150); }
.callout-info { background: var(--accent-soft); border: 1px solid oklch(0.85 0.04 200); color: var(--accent-ink); }
.terminal-pane { background: var(--term-bg); display: flex; flex-direction: column; position: relative; }
.term-chrome { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #2a2926; background: var(--term-bg-2); }
.term-dots { display: flex; gap: 6px; }
.term-dot { width: 11px; height: 11px; border-radius: 50%; background: #44423e; }
.term-dot:nth-child(1) { background: #e0826e; }
.term-dot:nth-child(2) { background: #d6b269; }
.term-dot:nth-child(3) { background: #92b287; }
.term-title { font-family: var(--font-mono); font-size: 11px; color: var(--term-mute); letter-spacing: 0.02em; }
.term-run-btn {
  background: transparent;
  border: 1px solid #38362f;
  color: var(--term-mute);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 6px;
  display: flex; align-items: center; gap: 6px;
  transition: all 140ms ease;
}
.term-run-btn:hover:not(:disabled) { color: var(--term-fg); border-color: #4a4840; background: #2a2926; }
.term-run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.term-run-btn svg { width: 10px; height: 10px; }
.term-body {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--term-fg);
  padding: 16px 18px 24px;
  line-height: 1.65;
  overflow-y: auto;
  flex: 1;
  white-space: pre-wrap;
  word-break: break-all;
  min-height: 320px;
  max-height: 520px;
}
.term-body::-webkit-scrollbar { width: 8px; }
.term-body::-webkit-scrollbar-thumb { background: #38362f; border-radius: 4px; }
.term-line { display: block; }
.term-line.is-prompt::before { content: "$ "; color: var(--term-prompt); }
.term-line.is-prompt-venv::before { content: "(.venv) $ "; color: var(--term-prompt); }
.term-line.is-mute { color: var(--term-mute); }
.term-line.is-ok { color: var(--term-ok); }
.term-line.is-warn { color: var(--term-warn); }
.term-line.is-err { color: var(--term-err); }
.term-line.is-dim { color: #6a6759; }
.term-line.is-spacer { height: 8px; }
.term-cursor { display: inline-block; width: 8px; height: 14px; background: var(--term-fg); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.term-empty { color: var(--term-mute); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.term-empty-key { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; border: 1px solid #38362f; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; margin: 0 2px; color: var(--term-fg); }
.detail-footer { border-top: 1px solid var(--line); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--bg-elev); }
.nav-btn { background: transparent; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 8px 14px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; transition: all 140ms ease; }
.nav-btn:hover:not(:disabled) { border-color: var(--ink-4); color: var(--ink); background: white; }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav-btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.nav-btn-primary:hover:not(:disabled) { background: #000; color: var(--bg); border-color: #000; }
.nav-btn svg { width: 12px; height: 12px; }
.nav-step-indicator { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.flow-screen { padding: 32px 28px; display: flex; flex-direction: column; gap: 20px; }
.flow-chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flow-chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; transition: all 160ms ease; }
.flow-chip.is-done { background: var(--accent-soft); border-color: oklch(0.85 0.04 200); color: var(--accent-ink); }
.flow-chip-num { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); background: var(--bg-sunken); border-radius: 4px; padding: 1px 5px; }
.flow-chip.is-done .flow-chip-num { background: white; color: var(--accent-ink); }
.flow-arrow { color: var(--ink-4); font-family: var(--font-mono); }
.faq-list { display: flex; flex-direction: column; gap: 10px; }
.faq-item { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.faq-q { font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
.faq-q-icon { font-family: var(--font-mono); font-size: 11px; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 6px; }
.faq-a { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin: 0; }
.faq-a code { font-family: var(--font-mono); font-size: 12px; background: var(--bg-sunken); padding: 1px 5px; border-radius: 4px; color: var(--ink); }
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.summary-card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.summary-card-eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.summary-card-title { font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
.summary-card-body { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin: 0; }
.fade-in { animation: fadeIn 240ms ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script>
// ===================== DATA =====================
window.STEPS = [
  {
    id: "git", num: "01", title: "Git 설치", sub: "git-scm.com",
    desc: "Windows용 Git을 설치하면 Git Bash 터미널이 함께 깔립니다. 이 수업에선 Git Bash를 메인 터미널로 씁니다.",
    actions: [{ kind: "link", label: "git-scm.com 다운로드 페이지 열기", href: "https://git-scm.com/download/win" }],
    note: "설치 마법사의 모든 옵션은 그대로 두고 Next 만 눌러도 됩니다. 기본값이 학습용으로 충분합니다.",
    callout: { kind: "ok", text: "설치 후 시작 메뉴에서 "Git Bash" 를 검색해 실행하세요." },
    terminalTitle: "Git Bash",
    terminal: [
      { type: "mute", text: "# 시작 메뉴에서 Git Bash를 실행하면 이런 화면이 나옵니다" },
      { type: "spacer" },
      { type: "dim", text: "user@DESKTOP MINGW64 ~" },
      { type: "prompt", text: "git --version" },
      { type: "out", text: "git version 2.45.1.windows.1" },
      { type: "spacer" },
      { type: "ok", text: "✓ Git Bash가 정상적으로 열렸습니다." }
    ]
  },
  {
    id: "folder", num: "02", title: "작업 폴더 만들기", sub: "mkdir / cd",
    desc: "수업에서 사용할 폴더 구조를 만듭니다. 홈 디렉터리(~) 아래에 ai_class/streamlit_labs 두 단계로 만들 거예요.",
    commands: ["mkdir ai_class", "cd ai_class", "mkdir streamlit_labs", "cd streamlit_labs"],
    note: "현재 위치가 헷갈릴 땐 pwd 를 입력해 확인할 수 있습니다.",
    terminalTitle: "~/ai_class/streamlit_labs",
    terminal: [
      { type: "prompt", text: "mkdir ai_class" },
      { type: "prompt", text: "cd ai_class" },
      { type: "prompt", text: "mkdir streamlit_labs" },
      { type: "prompt", text: "cd streamlit_labs" },
      { type: "prompt", text: "pwd" },
      { type: "out", text: "/c/Users/me/ai_class/streamlit_labs" },
      { type: "spacer" },
      { type: "ok", text: "✓ 작업 폴더로 이동 완료" }
    ]
  },
  {
    id: "uv", num: "03", title: "uv 설치", sub: "Astral uv",
    desc: "uv 는 빠른 파이썬 패키지/환경 매니저입니다. pip 보다 훨씬 빠르고, 가상환경과 파이썬 버전을 한꺼번에 관리해줍니다.",
    commands: ["curl -LsSf https://astral.sh/uv/install.sh | sh"],
    callout: { kind: "warn", text: "설치가 끝나면 Git Bash 창을 한 번 껐다가 다시 켜야 합니다. (PATH 환경변수 적용)" },
    note: "재시작 후 아래 명령으로 설치를 확인하세요.",
    commandsAfter: ["uv --version"],
    terminalTitle: "Git Bash — uv install",
    terminal: [
      { type: "prompt", text: "curl -LsSf https://astral.sh/uv/install.sh | sh" },
      { type: "out", text: "downloading uv 0.5.4 x86_64-pc-windows-msvc" },
      { type: "out", text: "installing to /c/Users/me/.local/bin" },
      { type: "out", text: "  uv" },
      { type: "out", text: "  uvx" },
      { type: "ok", text: "everything's installed!" },
      { type: "spacer" },
      { type: "warn", text: "⚠ Git Bash를 다시 시작해 주세요" },
      { type: "spacer" },
      { type: "dim", text: "# 재시작 후" },
      { type: "prompt", text: "uv --version" },
      { type: "out", text: "uv 0.5.4" },
      { type: "ok", text: "✓ 버전이 보이면 성공" }
    ]
  },
  {
    id: "init", num: "04", title: "프로젝트 초기화", sub: "uv init / venv",

window.FAQ = [
  { code: "uv: command not found", answer: "Git Bash 창을 완전히 닫고 새로 여세요. uv 설치 직후엔 PATH가 새 창에서만 적용됩니다." },
  { code: "(.venv) 가 안 붙음", answer: "`source .venv/Scripts/activate` 를 다시 실행하세요. 다른 폴더에 있다면 먼저 `cd ~/ai_class/streamlit_labs` 로 이동." },
  { code: "streamlit: command not found", answer: "가상환경 활성화가 안 된 상태입니다. 프롬프트 맨 앞에 `(.venv)` 가 있는지 먼저 확인하세요." },
  { code: "Permission denied / SSL error", answer: "회사·학교 네트워크에서 종종 발생합니다. 다른 네트워크에서 다시 시도하거나, VPN을 잠시 꺼보세요." },
  { code: "포트 8501 사용 중", answer: "이미 다른 Streamlit이 떠 있는 경우입니다. `streamlit hello --server.port 8502` 로 포트를 바꿔 실행." },
  { code: "Python 3.11 설치 못 찾음", answer: "`uv python install 3.11` 을 한 번 실행하면 uv가 직접 Python 3.11을 받아옵니다." }
];

  <script type="text/babel">
const { useState, useEffect, useRef } = React;

const Icon = {
  check: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg>),
  copy: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11"/></svg>),
  arrowR: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3.5 8h9M9 4.5L12.5 8 9 11.5"/></svg>),
  arrowL: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12.5 8h-9M7 4.5L3.5 8 7 11.5"/></svg>),
  play: () => (<svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 2l7 4-7 4z"/></svg>),
  external: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M9 3h4v4M13 3l-6 6M11 9v3.5A1.5 1.5 0 0 1 9.5 14h-6A1.5 1.5 0 0 1 2 12.5v-6A1.5 1.5 0 0 1 3.5 5H7"/></svg>),
  warn: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M8 2.5L14 13H2L8 2.5z"/><path d="M8 7v3M8 11.5v.5" strokeLinecap="round"/></svg>),
  info: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 7.5V11M8 5v.5"/></svg>),
  ok: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="6"/><path d="M5.5 8.2l1.8 1.8L11 6.5"/></svg>),
  refresh: () => (<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 3v3h-3"/></svg>)
};

function CmdRow({ text, promptVenv = false }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(() => setCopied(false), 1400);
  };
  return (
    <div className="cmd">
      <span className="cmd-prompt">{promptVenv ? "(.venv) $" : "$"}</span>
      <span className="cmd-text">{text}</span>
      <button className={"cmd-copy " + (copied ? "is-copied" : "")} onClick={copy} aria-label="복사">
        {copied ? <><Icon.check /> 복사됨</> : <><Icon.copy /> 복사</>}
      </button>
    </div>
  );
}

function Callout({ kind, text }) {
  const map = { warn: <Icon.warn />, ok: <Icon.ok />, info: <Icon.info /> };
  return (<div className={"callout callout-" + kind}>{map[kind]}<span>{text}</span></div>);
}

function Terminal({ title, lines, runState, onRun }) {
  const bodyRef = useRef(null);
  const [revealed, setRevealed] = useState(lines.length);
  useEffect(() => { setRevealed(lines.length); }, [lines]);
  useEffect(() => {
    if (runState === "running") {
      setRevealed(0); let i = 0;
      const tick = () => {
        i += 1; setRevealed(i);
        if (i < lines.length) {
          const ln = lines[i] || {};
          const delay = ln.type === "prompt" || ln.type === "prompt-venv" ? 280 : ln.type === "spacer" ? 80 : ln.type === "ok" || ln.type === "warn" ? 380 : 140;
          timer = setTimeout(tick, delay);
        }
      };
      let timer = setTimeout(tick, 200);
      return () => clearTimeout(timer);
    }
  }, [runState, lines]);
  useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [revealed]);
  const visible = lines.slice(0, revealed);
  const showCursor = runState === "running" && revealed < lines.length;
  return (
    <section className="terminal-pane">
      <header className="term-chrome">
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div className="term-dots"><span className="term-dot" /><span className="term-dot" /><span className="term-dot" /></div>
          <span className="term-title">{title}</span>
        </div>
        <button className="term-run-btn" onClick={onRun} disabled={runState === "running"}>
          {runState === "running" ? <>실행중…</> : <><Icon.play /> 다시 실행</>}
        </button>
      </header>
      <div className="term-body" ref={bodyRef}>
        {visible.map((ln, i) => {
          if (ln.type === "spacer") return <span key={i} className="term-line is-spacer" />;
          const cls = { "prompt": "is-prompt", "prompt-venv": "is-prompt-venv", "ok": "is-ok", "warn": "is-warn", "err": "is-err", "mute": "is-mute", "dim": "is-dim", "out": "" }[ln.type] || "";
          return <span key={i} className={"term-line " + cls}>{ln.text}{i === visible.length - 1 && showCursor ? <span className="term-cursor" /> : null}</span>;
        })}
        {!showCursor && runState !== "running" && (<span className="term-line is-prompt"><span className="term-cursor" /></span>)}
      </div>
    </section>
  );
}

function StepScreen({ step, isDone, onToggleDone }) {
  const [runId, setRunId] = useState(0);
  const [runState, setRunState] = useState("idle");
  useEffect(() => {
    setRunId(x => x + 1); setRunState("running");
    const total = step.terminal.length * 220 + 600;
    const t = setTimeout(() => setRunState("idle"), total);
    return () => clearTimeout(t);
  }, [step.id]);
  const replay = () => {
    setRunId(x => x + 1); setRunState("running");
    const total = step.terminal.length * 220 + 600;
    setTimeout(() => setRunState("idle"), total);
  };
  return (
    <div className="fade-in" key={step.id} style={{ display: "contents" }}>
      <div className="detail-header">
        <div>
          <p className="detail-eyebrow">Step {step.num} · {step.sub}</p>
          <h2 className="detail-title">{step.title}</h2>
          <p className="detail-desc">{step.desc}</p>
        </div>
        <button className={"complete-pill " + (isDone ? "is-done" : "")} onClick={onToggleDone}>
          {isDone ? <><Icon.check /> 완료됨</> : <>완료 표시</>}
        </button>
      </div>
      <div className="detail-body">
        <div className="instructions">
          {step.actions && step.actions.map((a, i) => (
            <a key={i} className="callout callout-info" href={a.href} target="_blank" rel="noreferrer" style={{ textDecoration: "none" }}>
              <Icon.external /><span>{a.label}</span>
            </a>
          ))}
          {step.commands && (
            <div className="cmd-block">
              <p className="section-label">실행할 명령</p>
              {step.commands.map((c, i) => <CmdRow key={i} text={c} promptVenv={step.id === "libs" || step.id === "run"} />)}
            </div>
          )}
          {step.callout && <Callout kind={step.callout.kind} text={step.callout.text} />}
          {step.note && <p className="note">{step.note}</p>}
          {step.commandsAfter && (
            <div className="cmd-block">
              <p className="section-label">확인 명령</p>
              {step.commandsAfter.map((c, i) => <CmdRow key={i} text={c} />)}
            </div>
          )}
        </div>
        <Terminal key={runId} title={step.terminalTitle} lines={step.terminal} runState={runState} onRun={replay} />
      </div>
    </div>
  );
}

function FlowScreen({ steps, doneSet }) {
  return (
    <div className="fade-in" style={{ display: "contents" }}>
      <div className="detail-header">
        <div>
          <p className="detail-eyebrow">Overview</p>
          <h2 className="detail-title">전체 흐름 요약</h2>
          <p className="detail-desc">7단계의 순서를 한눈에 확인하세요. 완료한 단계는 강조됩니다.</p>
        </div>
        <span className="complete-pill">{doneSet.size} / {steps.length}</span>
      </div>
      <div className="flow-screen">
        <div className="flow-chain">
          {steps.map((s, i) => (
            <React.Fragment key={s.id}>
              <span className={"flow-chip " + (doneSet.has(s.id) ? "is-done" : "")}>
                <span className="flow-chip-num">{s.num}</span>{s.title}
              </span>
              {i < steps.length - 1 && <span className="flow-arrow">→</span>}
            </React.Fragment>
          ))}
        </div>
        <div>
          <p className="section-label" style={{ marginBottom: 10 }}>핵심 한 줄 요약</p>
          <div className="summary-grid">
            <div className="summary-card"><p className="summary-card-eyebrow">기반</p><p className="summary-card-title">Git Bash</p><p className="summary-card-body">Windows에서 가장 호환성 좋은 셸. 모든 명령은 여기서 실행합니다.</p></div>
            <div className="summary-card"><p className="summary-card-eyebrow">매니저</p><p className="summary-card-title">uv</p><p className="summary-card-body">Python 버전 + 가상환경 + 패키지를 한 도구로 관리. 빠르고 단순합니다.</p></div>
            <div className="summary-card"><p className="summary-card-eyebrow">목적지</p><p className="summary-card-title">Streamlit</p><p className="summary-card-body">파이썬 코드만으로 웹앱을 만드는 라이브러리. 수업 실습의 메인 도구.</p></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function FaqScreen({ faqs }) {
  return (
    <div className="fade-in" style={{ display: "contents" }}>
      <div className="detail-header">
        <div>
          <p className="detail-eyebrow">Troubleshooting</p>
          <h2 className="detail-title">자주 막히는 포인트</h2>
          <p className="detail-desc">실습 중 자주 발생하는 에러와 해결 방법입니다. 막히면 먼저 여기를 확인하세요.</p>
        </div>
      </div>
      <div className="flow-screen">
        <div className="faq-list">
          {faqs.map((f, i) => (
            <div className="faq-item" key={i}>
              <p className="faq-q"><span className="faq-q-icon">{f.code}</span></p>
              <p className="faq-a">{f.answer}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const steps = window.STEPS;
  const faqs = window.FAQ;
  const STORAGE = "wcheat:v1";
  const initial = (() => {
    try { const raw = localStorage.getItem(STORAGE); if (raw) return JSON.parse(raw); } catch (e) {}
    return { activeId: steps[0].id, done: [] };
  })();
  const [activeId, setActiveId] = useState(initial.activeId);
  const [doneSet, setDoneSet] = useState(new Set(initial.done));
  useEffect(() => { localStorage.setItem(STORAGE, JSON.stringify({ activeId, done: [...doneSet] })); }, [activeId, doneSet]);
  const isFlow = activeId === "__flow";
  const isFaq = activeId === "__faq";
  const activeIdx = steps.findIndex(s => s.id === activeId);
  const activeStep = activeIdx >= 0 ? steps[activeIdx] : null;
  const toggleDone = (id) => { setDoneSet(prev => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; }); };
  const goNext = () => {
    if (isFlow) { setActiveId(steps[0].id); return; }
    if (isFaq) { setActiveId("__flow"); return; }
    if (activeIdx < steps.length - 1) { setDoneSet(prev => new Set([...prev, activeId])); setActiveId(steps[activeIdx + 1].id); }
    else { setDoneSet(prev => new Set([...prev, activeId])); setActiveId("__flow"); }
  };
  const goPrev = () => {
    if (isFlow) { setActiveId(steps[steps.length - 1].id); return; }
    if (isFaq) { setActiveId("__flow"); return; }
    if (activeIdx > 0) setActiveId(steps[activeIdx - 1].id);
  };
  const reset = () => {
    if (!confirm("모든 진행 상황을 초기화할까요?")) return;
    setDoneSet(new Set()); setActiveId(steps[0].id);
  };
  const doneCount = steps.filter(s => doneSet.has(s.id)).length;
  const pct = Math.round((doneCount / steps.length) * 100);
  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">$_</div>
          <div className="brand-meta">
            <span className="eyebrow">Windows · Git Bash · uv · Streamlit</span>
            <h1 className="title-h1">개발환경 구축 치트시트</h1>
          </div>
        </div>
        <div className="progress-summary">
          <span className="progress-text"><strong>{doneCount}</strong> / {steps.length} 완료 · {pct}%</span>
          <div className="progress-track"><div className="progress-fill" style={{ width: pct + "%" }} /></div>
          <button className="reset-btn" onClick={reset}><span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><Icon.refresh /> 초기화</span></button>
        </div>
      </header>
      <div className="layout">
        <aside className="steps-panel">
          <div className="steps-list">
            {steps.map(s => {
              const isActive = s.id === activeId;
              const isDone = doneSet.has(s.id);
              return (
                <button key={s.id} className={"step-item " + (isActive ? "is-active " : "") + (isDone ? "is-done" : "")} onClick={() => setActiveId(s.id)}>
                  <span className="step-num">{isDone ? <Icon.check /> : s.num}</span>
                  <span className="step-label">
                    <span className="step-label-title">{s.title}</span>
                    <span className="step-label-sub">{s.sub}</span>
                  </span>
                </button>
              );
            })}
          </div>
          <div className="steps-divider" />
          <button className={"flow-link " + (isFlow ? "is-active" : "")} onClick={() => setActiveId("__flow")}><span className="flow-link-icon">∎</span> 전체 흐름</button>
          <button className={"flow-link " + (isFaq ? "is-active" : "")} onClick={() => setActiveId("__faq")}><span className="flow-link-icon">!</span> 자주 막히는 포인트</button>
        </aside>
        <main className="detail">
          {isFlow && <FlowScreen steps={steps} doneSet={doneSet} />}
          {isFaq && <FaqScreen faqs={faqs} />}
          {activeStep && <StepScreen step={activeStep} isDone={doneSet.has(activeStep.id)} onToggleDone={() => toggleDone(activeStep.id)} />}
          <footer className="detail-footer">
            <button className="nav-btn" onClick={goPrev} disabled={activeIdx === 0 && !isFlow && !isFaq}><Icon.arrowL /> 이전</button>
            <span className="nav-step-indicator">{isFlow ? "OVERVIEW" : isFaq ? "TROUBLESHOOTING" : `${activeStep.num} / ${steps[steps.length-1].num}`}</span>
            <button className="nav-btn nav-btn-primary" onClick={goNext}>
              {isFlow ? "처음부터 다시" : isFaq ? "전체 흐름으로" : (activeIdx === steps.length - 1 ? "전체 흐름 보기" : "다음 단계")}
              <Icon.arrowR />
            </button>
          </footer>
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
